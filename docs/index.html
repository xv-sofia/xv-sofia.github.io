<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XV Sofía · Comparte tus fotos</title>
<meta name="description" content="Sube las fotos que tomaste en los XV de Sofía.">
<meta name="theme-color" content="#f7eef0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #f7eef0;
    --tarjeta: #fffafb;
    --texto: #3b2a30;
    --texto-suave: #7a6168;
    --acento: #b5838d;
    --acento-fuerte: #8f5f6a;
    --dorado: #c9a96e;
    --borde: #ead9dd;
    --ok: #4f8a5b;
    --error: #b4483f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { background: var(--fondo); }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #fff 0%, var(--fondo) 60%) fixed;
    color: var(--texto);
    font: 16px/1.5 Inter, system-ui, -apple-system, sans-serif;
    padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
  }
  main { max-width: 480px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  .xv {
    font: 600 14px/1 "Cormorant Garamond", serif;
    letter-spacing: .4em;
    color: var(--dorado);
    text-transform: uppercase;
  }
  h1 {
    font: 400 64px/1.1 "Great Vibes", cursive;
    color: var(--acento-fuerte);
    margin: 8px 0 4px;
  }
  .bajada {
    font: 500 20px/1.4 "Cormorant Garamond", serif;
    color: var(--texto-suave);
    margin: 0;
  }
  .filete { width: 80px; height: 1px; background: var(--dorado); margin: 20px auto 0; }
  .tarjeta {
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 8px 30px rgba(143, 95, 106, .08);
  }
  label { display: block; font-weight: 500; margin-bottom: 6px; }
  .opcional { color: var(--texto-suave); font-weight: 400; font-size: 14px; }
  input[type=text] {
    width: 100%;
    font: inherit;
    padding: 12px 14px;
    border: 1px solid var(--borde);
    border-radius: 12px;
    background: #fff;
    color: var(--texto);
  }
  input[type=text]:focus { outline: 2px solid var(--acento); outline-offset: 1px; }
  .boton {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    margin-top: 20px;
    padding: 18px;
    border: 0;
    border-radius: 14px;
    background: var(--acento-fuerte);
    color: #fff;
    font: 600 18px/1 Inter, sans-serif;
    cursor: pointer;
  }
  .boton:active { transform: scale(.98); }
  .boton[aria-disabled=true] { opacity: .5; pointer-events: none; }
  .boton svg { width: 22px; height: 22px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .nota { font-size: 14px; color: var(--texto-suave); text-align: center; margin: 12px 0 0; }
  .estado {
    margin-top: 20px;
    padding: 14px 16px;
    border-radius: 12px;
    background: #fff;
    border: 1px solid var(--borde);
    text-align: center;
    font-weight: 500;
  }
  .tarjeta > .estado:first-child { margin-top: 0; margin-bottom: 20px; }
  .estado.gracias { background: #f1f7f2; border-color: #cfe3d3; color: var(--ok); }
  .estado.aviso { background: #fbf0ef; border-color: #f0d2cf; color: var(--error); }
  ul { list-style: none; margin: 16px 0 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--borde);
    font-size: 14px;
  }
  li:first-child { border-top: 0; }
  .miniatura {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: var(--fondo) center/cover no-repeat;
  }
  .detalle { flex: 1; min-width: 0; }
  .archivo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .situacion { color: var(--texto-suave); }
  li.listo .situacion { color: var(--ok); }
  li.fallo .situacion { color: var(--error); }
  .barra { height: 4px; border-radius: 2px; background: var(--borde); margin-top: 6px; overflow: hidden; }
  .barra span { display: block; height: 100%; width: 0; background: var(--acento); transition: width .3s; }
  li.subiendo .barra span { width: 40%; animation: vaiven 1.2s ease-in-out infinite alternate; }
  li.listo .barra span { width: 100%; background: var(--ok); }
  li.fallo .barra span { width: 100%; background: var(--error); }
  @keyframes vaiven { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .aviso-fijo {
    position: sticky;
    top: 0;
    z-index: 10;
    margin: -32px -16px 24px;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    background: var(--acento-fuerte);
    color: #fff;
    text-align: center;
    font-weight: 600;
    font-size: 15px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="avisoSubiendo" class="aviso-fijo" role="status" hidden>
  No cierres esta pantalla hasta que terminen de subir
</div>
<main>
  <header>
    <div class="xv">Mis XV años</div>
    <h1>Sofía</h1>
    <p class="bajada">Gracias por acompañarme.<br>Comparte conmigo las fotos que tomaste.</p>
    <div class="filete"></div>
  </header>

  <section class="tarjeta">
    <p id="sinConfigurar" class="estado aviso" hidden>
      Esta página todavía no está conectada. Vuelve a intentarlo más tarde.
    </p>

    <label for="nombre">¿Quién eres? <span class="opcional">(opcional)</span></label>
    <input id="nombre" type="text" autocomplete="name" placeholder="Ej.: Tía Marta" maxlength="60">

    <label id="botonElegir" class="boton" for="archivos" role="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Elegir fotos y videos
    </label>
    <input id="archivos" type="file" accept="image/*,video/*" multiple>
    <p class="nota">Puedes elegir varias a la vez. Deja esta pantalla abierta mientras se suben.</p>

    <p id="estado" class="estado" hidden></p>
    <ul id="lista"></ul>
  </section>
</main>

<script>
  // URL del Apps Script desplegado como aplicación web (termina en /exec).
  const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbxQXxGoEUlw3RHM82ynzjS4xzaG9tZwPJfBTEbTOn2ZwjfZtrQusHr1U4N7z_7T53iuQw/exec';

  // Debe coincidir con TAMANO_MAXIMO_BYTES de apps-script/Codigo.gs.
  const TAMANO_MAXIMO_BYTES = 35 * 1024 * 1024;
  const MENSAJE_MUY_PESADO = 'Muy pesado (más de 35 MB). Envíalo por WhatsApp 💌';
  const INTENTOS = 3;

  // A veces la respuesta de Google no llega aunque la foto sí se guardó (visto en iPhone y en
  // escritorio). Sin tope, el invitado quedaría en "Subiendo…" para siempre. El tope crece con
  // el tamaño: 8 s por MB cubre una subida móvil de ~1 Mbps. Puede ser corto porque reintentar
  // no duplica: cada archivo lleva un idSubida y el script no guarda dos veces el mismo.
  const ESPERA_BASE_MS = 30 * 1000;
  const ESPERA_POR_MB_MS = 8 * 1000;
  const ESPERA_CONSULTA_MS = 15 * 1000;

  // Apps Script recibe a ~0,5 MB/s: una foto de iPhone (3–5 MB, +33 % por base64) tardaba
  // 12–16 s. Reducida a 2560 px (alcanza para imprimir 20×30 cm) queda en ~1 MB y ~5 s.
  // Videos y GIF se suben tal cual.
  const LADO_MAXIMO_PX = 2560;
  const CALIDAD_JPEG = 0.85;
  const REDUCIR_DESDE_BYTES = 1.5 * 1024 * 1024;

  // Todas las ejecuciones del script corren con la misma cuenta, y Google permite 30 a la vez
  // por cuenta EN TOTAL: 3 por invitado deja lugar para ~10 invitados subiendo al mismo tiempo.
  // Si se pasa, Google rechaza y la página reintenta sola.
  const SUBIDAS_SIMULTANEAS = 3;

  // Si el invitado cierra la página a mitad de camino y vuelve a elegir todas sus fotos, las ya
  // subidas se saltan. La huella es SHA-256 de los primeros 4 MB + el tamaño (hashear un video
  // de 35 MB entero sería lento en un celular) y se guarda en este navegador.
  const CLAVE_SUBIDAS = 'xv-sofia-subidas';
  const BYTES_HUELLA = 4 * 1024 * 1024;
  const HUELLAS_RECORDADAS = 3000;

  // Algunos navegadores dejan file.type vacío (sobre todo con HEIC); lo deducimos de la extensión.
  const TIPOS_POR_EXTENSION = {
    jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp',
    heic: 'image/heic', heif: 'image/heif', dng: 'image/x-adobe-dng',
    mp4: 'video/mp4', mov: 'video/quicktime', m4v: 'video/x-m4v', '3gp': 'video/3gpp', webm: 'video/webm',
  };

  const campoNombre = document.getElementById('nombre');
  const campoArchivos = document.getElementById('archivos');
  const botonElegir = document.getElementById('botonElegir');
  const estado = document.getElementById('estado');
  const lista = document.getElementById('lista');
  const avisoSubiendo = document.getElementById('avisoSubiendo');

  const cola = [];
  const huellasEnCurso = new Set();
  let bloqueoPantalla = null;
  let activos = 0;
  let subidos = 0;
  let yaEstaban = 0;
  let fallidos = 0;
  let totalLote = 0;

  if (!URL_SCRIPT) {
    document.getElementById('sinConfigurar').hidden = false;
    botonElegir.setAttribute('aria-disabled', 'true');
  }

  // El nombre se recuerda solo como comodidad; si el almacenamiento falla, la página sigue igual.
  try { campoNombre.value = localStorage.getItem('xv-sofia-nombre') || ''; } catch (_) {}
  campoNombre.addEventListener('change', () => {
    try { localStorage.setItem('xv-sofia-nombre', campoNombre.value.trim()); } catch (_) {}
  });

  campoArchivos.addEventListener('change', () => {
    for (const archivo of campoArchivos.files) encolar(archivo);
    campoArchivos.value = '';
    procesarCola();
  });

  window.addEventListener('beforeunload', (evento) => {
    if (activos > 0) { evento.preventDefault(); evento.returnValue = ''; }
  });

  // El navegador suelta el wake lock solo cuando la página pasa a segundo plano; al volver, si
  // todavía hay subidas, se pide de nuevo.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && activos > 0) mantenerPantallaEncendida();
  });

  // Evita que el celular se bloquee solo mientras sube (iOS 16.4+, Chrome Android). Si el
  // navegador no lo soporta o lo niega, la subida sigue igual.
  async function mantenerPantallaEncendida() {
    if (bloqueoPantalla || !('wakeLock' in navigator)) return;
    try {
      bloqueoPantalla = await navigator.wakeLock.request('screen');
      bloqueoPantalla.addEventListener('release', () => { bloqueoPantalla = null; });
    } catch (_) {}
  }

  function soltarPantalla() {
    if (bloqueoPantalla) bloqueoPantalla.release().catch(() => {});
    bloqueoPantalla = null;
  }

  function tipoDe(archivo) {
    if (archivo.type) return archivo.type;
    const extension = archivo.name.split('.').pop().toLowerCase();
    return TIPOS_POR_EXTENSION[extension] || '';
  }

  function encolar(archivo) {
    const fila = document.createElement('li');
    fila.innerHTML =
      '<div class="miniatura"></div>' +
      '<div class="detalle"><div class="archivo"></div><div class="situacion">En espera</div>' +
      '<div class="barra"><span></span></div></div>';
    fila.querySelector('.archivo').textContent = archivo.name;
    const tipo = tipoDe(archivo);
    if (tipo.startsWith('image/') && !/hei[cf]/.test(tipo)) {
      fila.querySelector('.miniatura').style.backgroundImage = `url(${URL.createObjectURL(archivo)})`;
    }
    lista.prepend(fila);

    if (!/^(image|video)\//.test(tipo)) return marcar(fila, 'fallo', 'Solo se aceptan fotos y videos');
    // Las fotos pesadas no se rechazan acá: después de reducirlas suelen entrar de sobra.
    if (!tipo.startsWith('image/') && archivo.size > TAMANO_MAXIMO_BYTES) {
      return marcar(fila, 'fallo', MENSAJE_MUY_PESADO);
    }
    cola.push({ archivo, tipo, fila });
    totalLote++;
  }

  // Hasta SUBIDAS_SIMULTANEAS trabajadores sacan archivos de la misma cola. Si el invitado elige
  // más fotos mientras tanto, se suman a la cola y se lanzan trabajadores si hay lugar.
  function procesarCola() {
    if (cola.length && activos === 0) {
      avisoSubiendo.hidden = false;
      mantenerPantallaEncendida();
    }
    while (activos < SUBIDAS_SIMULTANEAS && cola.length) {
      activos++;
      trabajar().finally(() => {
        activos--;
        if (activos === 0) {
          avisoSubiendo.hidden = true;
          soltarPantalla();
          if (totalLote) cerrarLote();
        }
      });
    }
    mostrarProgreso();
  }

  async function trabajar() {
    while (cola.length) {
      const { archivo, tipo, fila } = cola.shift();
      marcar(fila, 'subiendo', 'Subiendo…');
      try {
        const { yaEstaba } = await subirConReintentos(archivo, tipo, fila);
        if (yaEstaba) yaEstaban++; else subidos++;
        marcar(fila, 'listo', yaEstaba ? 'Ya estaba subida ✓' : 'Subida ✓');
      } catch (error) {
        fallidos++;
        marcar(fila, 'fallo', error.message || 'No se pudo subir');
      }
      mostrarProgreso();
    }
  }

  function mostrarProgreso() {
    const listas = subidos + yaEstaban + fallidos;
    if (totalLote && listas < totalLote) mostrarEstado(`Subiendo… ${listas} de ${totalLote} listas`);
  }

  // Devuelve { yaEstaba: true } si la foto ya se había subido antes (en esta selección, en una
  // visita anterior desde este navegador, o según el script en las últimas 6 h).
  async function subirConReintentos(archivo, tipo, fila) {
    const huella = await huellaDe(archivo);
    if (huella && (huellasEnCurso.has(huella) || yaSubidaAntes(huella))) return { yaEstaba: true };
    if (huella) huellasEnCurso.add(huella);
    try {
      const preparado = await prepararArchivo(archivo, tipo);
      if (preparado.blob.size > TAMANO_MAXIMO_BYTES) {
        const error = new Error(MENSAJE_MUY_PESADO);
        error.definitivo = true;
        throw error;
      }
      const datosBase64 = await leerBase64(preparado.blob);
      // La huella sirve también de idSubida: el script descarta repetidos aunque este navegador
      // haya olvidado lo que subió.
      const idSubida = huella || nuevoIdSubida();
      let ultimoError;
      for (let intento = 1; intento <= INTENTOS; intento++) {
        try {
          if (intento > 1) {
            marcar(fila, 'subiendo', 'Reintentando…');
            // Si el intento anterior sí llegó y solo se perdió la respuesta, no se reenvía entero.
            if (await yaLlego(idSubida)) {
              recordarSubida(huella);
              return { yaEstaba: false };
            }
          }
          const resultado = await subir(preparado.nombre, preparado.tipo, datosBase64, idSubida);
          recordarSubida(huella);
          return { yaEstaba: resultado.repetido === true };
        } catch (error) {
          ultimoError = error;
          if (error.definitivo) break;
          await new Promise((r) => setTimeout(r, 1500 * intento));
        }
      }
      throw ultimoError;
    } finally {
      if (huella) huellasEnCurso.delete(huella);
    }
  }

  // SHA-256 en hexadecimal (64 caracteres, el formato que acepta el script). '' si el navegador
  // no puede calcularla: la subida sigue sin esta protección.
  async function huellaDe(archivo) {
    try {
      const inicio = await archivo.slice(0, BYTES_HUELLA).arrayBuffer();
      const tamano = new TextEncoder().encode(':' + archivo.size);
      const datos = new Uint8Array(inicio.byteLength + tamano.length);
      datos.set(new Uint8Array(inicio), 0);
      datos.set(tamano, inicio.byteLength);
      const resumen = await crypto.subtle.digest('SHA-256', datos);
      return Array.from(new Uint8Array(resumen), (b) => b.toString(16).padStart(2, '0')).join('');
    } catch (_) {
      return '';
    }
  }

  function leerHuellasSubidas() {
    try { return JSON.parse(localStorage.getItem(CLAVE_SUBIDAS) || '[]'); } catch (_) { return []; }
  }

  function yaSubidaAntes(huella) {
    return leerHuellasSubidas().includes(huella);
  }

  function recordarSubida(huella) {
    if (!huella) return;
    try {
      const huellas = leerHuellasSubidas().filter((h) => h !== huella);
      huellas.push(huella);
      localStorage.setItem(CLAVE_SUBIDAS, JSON.stringify(huellas.slice(-HUELLAS_RECORDADAS)));
    } catch (_) {}
  }

  // Reduce la foto a LADO_MAXIMO_PX en JPEG. Ante cualquier duda devuelve el original: nunca se
  // pierde una foto por no poder reducirla (p. ej. HEIC en Chrome de escritorio, que no la abre).
  // Al pasar por <img> el navegador ya aplica la rotación EXIF, así que la foto no sale de lado.
  // Se pierden los metadatos EXIF (fecha de toma, lugar).
  async function prepararArchivo(archivo, tipo) {
    const original = { blob: archivo, nombre: archivo.name, tipo };
    if (!tipo.startsWith('image/') || tipo === 'image/gif') return original;
    try {
      const imagen = await cargarImagen(archivo);
      const ancho = imagen.naturalWidth;
      const alto = imagen.naturalHeight;
      const escala = Math.min(1, LADO_MAXIMO_PX / Math.max(ancho, alto));
      if (escala === 1 && archivo.size <= REDUCIR_DESDE_BYTES) return original;

      const lienzo = document.createElement('canvas');
      lienzo.width = Math.round(ancho * escala);
      lienzo.height = Math.round(alto * escala);
      const contexto = lienzo.getContext('2d');
      contexto.fillStyle = '#fff'; // un PNG transparente quedaría negro en JPEG
      contexto.fillRect(0, 0, lienzo.width, lienzo.height);
      contexto.drawImage(imagen, 0, 0, lienzo.width, lienzo.height);
      const reducida = await new Promise((r) => lienzo.toBlob(r, 'image/jpeg', CALIDAD_JPEG));
      lienzo.width = lienzo.height = 0; // libera la memoria del lienzo enseguida (iPhone)

      if (!reducida || reducida.size >= archivo.size) return original;
      return { blob: reducida, nombre: archivo.name.replace(/\.[^.]+$/, '') + '.jpg', tipo: 'image/jpeg' };
    } catch (_) {
      return original;
    }
  }

  function cargarImagen(archivo) {
    return new Promise((resolver, rechazar) => {
      const url = URL.createObjectURL(archivo);
      const imagen = new Image();
      imagen.onload = () => { URL.revokeObjectURL(url); resolver(imagen); };
      imagen.onerror = () => { URL.revokeObjectURL(url); rechazar(new Error('Formato no soportado')); };
      imagen.src = url;
    });
  }

  function nuevoIdSubida() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 14);
  }

  // Ante cualquier duda responde false: reenviar es seguro porque el script descarta repetidos.
  async function yaLlego(idSubida) {
    try {
      const resultado = await pedir(`${URL_SCRIPT}?id=${encodeURIComponent(idSubida)}`, {}, ESPERA_CONSULTA_MS);
      return resultado.existe === true;
    } catch (_) {
      return false;
    }
  }

  // text/plain mantiene la petición "simple": sin preflight CORS, que Apps Script no responde.
  // Por eso tampoco se usa xhr.upload.onprogress (registrarlo también fuerza el preflight).
  async function subir(nombreArchivo, tipo, datosBase64, idSubida) {
    const cuerpo = JSON.stringify({ nombre: campoNombre.value.trim(), archivo: nombreArchivo, tipo, idSubida, datosBase64 });
    const resultado = await pedir(URL_SCRIPT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: cuerpo,
    }, ESPERA_BASE_MS + ESPERA_POR_MB_MS * cuerpo.length / 1048576);
    if (!resultado.ok) {
      const error = new Error(resultado.error || 'No se pudo subir');
      error.definitivo = true; // un rechazo del servidor no se arregla reintentando
      throw error;
    }
    return resultado;
  }

  // fetch con tope de espera; devuelve el JSON de la respuesta.
  async function pedir(url, opciones, esperaMaximaMs) {
    const tope = new AbortController();
    const temporizador = setTimeout(() => tope.abort(), esperaMaximaMs);
    try {
      const respuesta = await fetch(url, { ...opciones, signal: tope.signal });
      if (!respuesta.ok) throw new Error('No se pudo subir. Revisa tu conexión.');
      return await respuesta.json();
    } catch (error) {
      // Errores de red y del tope llegan en inglés ("Failed to fetch", "AbortError").
      if (error.name === 'AbortError') throw new Error('La conexión tardó demasiado. Inténtalo de nuevo.');
      // TypeError: sin red. SyntaxError: Google devolvió una página en vez de JSON.
      if (error instanceof TypeError || error instanceof SyntaxError) {
        throw new Error('No se pudo subir. Revisa tu conexión.');
      }
      throw error;
    } finally {
      clearTimeout(temporizador);
    }
  }

  function leerBase64(archivo) {
    return new Promise((resolver, rechazar) => {
      const lector = new FileReader();
      lector.onload = () => resolver(String(lector.result).split(',')[1] || '');
      lector.onerror = () => rechazar(new Error('No se pudo leer el archivo'));
      lector.readAsDataURL(archivo);
    });
  }

  function marcar(fila, clase, texto) {
    fila.className = clase;
    fila.querySelector('.situacion').textContent = texto;
  }

  function mostrarEstado(texto, clase = '') {
    estado.hidden = false;
    estado.className = 'estado ' + clase;
    estado.textContent = texto;
  }

  function cerrarLote() {
    const nuevos = subidos === 1 ? 'Se subió 1 archivo' : `Se subieron ${subidos} archivos`;
    const repetidos = yaEstaban === 1 ? '1 ya estaba subido' : `${yaEstaban} ya estaban subidos`;
    if (fallidos > 0) {
      mostrarEstado(`Se subieron ${subidos + yaEstaban} de ${totalLote}. Puedes volver a elegir los que fallaron.`, 'aviso');
    } else if (subidos === 0) {
      mostrarEstado(`${yaEstaban === 1 ? 'Ese archivo ya estaba subido' : 'Esos archivos ya estaban subidos'}. ¡Gracias! 💖`, 'gracias');
    } else {
      mostrarEstado(`¡Gracias! ${nuevos}${yaEstaban ? ` (${repetidos})` : ''} 💖`, 'gracias');
    }
    subidos = yaEstaban = fallidos = totalLote = 0;
  }
</script>
</body>
</html>
